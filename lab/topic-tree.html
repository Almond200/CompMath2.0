<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic tree — experimental</title>
<style>
  /* Values match css/styles.css. */
  :root {
    --bg: #f6f8fc; --panel: #ffffff; --panel2: #eaeef7; --line: #d7deed; --line2: #c2cbe1;
    --text: #1b2333; --text-dim: #55607a; --text-faint: #808aa3; --accent: #2f66e0;
  }
  :root[data-theme="dark"] {
    --bg: #0f1420; --panel: #161d2e; --panel2: #1a2338; --line: #2a3654; --line2: #354467;
    --text: #e8ecf6; --text-dim: #9aa7c7; --text-faint: #6b7794; --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 26px 16px 70px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint);
         border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  a, a:visited { color: var(--accent); }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 30px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  h3 { font-size: 16px; margin: 22px 0 6px; }
  p, li { overflow-wrap: anywhere; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel2);
         border-radius: 5px; padding: 1px 5px; color: var(--text-dim); }
  ul, ol { padding-left: 22px; margin: 6px 0; }
  .tree { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 12px 10px; }
  .tree ul { list-style: none; padding-left: 18px; border-left: 1px solid var(--line); margin: 2px 0 6px 6px; }
  .tree > ul { border-left: 0; padding-left: 4px; margin: 0; }
  .tree li { margin: 2px 0; }
  .tree > ul > li { margin: 8px 0; }
  .tree li > code { margin-left: 4px; font-size: 11.5px; }
  .tools { display: flex; gap: 8px; margin: 14px 0 0; flex-wrap: wrap; }
  .tools button { font: inherit; font-size: 13px; color: var(--accent); background: var(--panel);
                  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .tools button:hover { border-color: var(--line2); }
  details.node > summary { cursor: pointer; list-style: none; }
  details.node > summary::-webkit-details-marker { display: none; }
  details.node > summary::before { content: "\25B8"; display: inline-block; width: 14px; color: var(--text-faint); transition: transform .12s; }
  details.node[open] > summary::before { transform: rotate(90deg); }
  .leaf::before { content: "\2022"; display: inline-block; width: 14px; color: var(--text-faint); }
  .msg { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Topic tree</h1><span class="tag">experimental</span></header>
  <p class="msg"><a href="../index.html#/settings">&larr; Back to Settings</a> &middot; The current draft of <code>TOPIC-TREE.md</code>, read live from the repository.</p>
  <div class="tools"><button type="button" id="expand">Expand all</button><button type="button" id="collapse">Collapse all</button></div>
  <main id="doc"><p class="msg">Loading&hellip;</p></main>
</div>
<script src="lab-common.js?v=3"></script>
<script>
(function () {
  "use strict";
  try { LabData.applyTheme(); } catch (e) {}
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  function inline(s) {
    var parts = s.split("`"), out = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2) { out += "<code>" + esc(parts[i]) + "</code>"; continue; }
      out += esc(parts[i])
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) { return /^(https?:|#|\.)/.test(u) || /^[\w.-]+$/.test(u) ? '<a href="' + u + '">' + t + "</a>" : t; });
    }
    return out;
  }
  // A list block becomes nested items {text, kids}; indentation is two spaces per level.
  function parseList(lines) {
    var root = { kids: [] }, stack = [{ depth: -1, node: root }];
    lines.forEach(function (l) {
      var m = /^(\s*)(?:[-*]|\d+\.)\s+(.*)$/.exec(l);
      if (!m) { var last = stack[stack.length - 1].node; if (last.text != null) last.text += " " + l.trim(); return; }
      var depth = Math.floor(m[1].length / 2), item = { text: m[2], kids: [] };
      while (stack[stack.length - 1].depth >= depth) stack.pop();
      stack[stack.length - 1].node.kids.push(item);
      stack.push({ depth: depth, node: item });
    });
    return root.kids;
  }
  function listHtml(items, ordered, tree) {
    var tagName = ordered ? "ol" : "ul";
    return "<" + tagName + ">" + items.map(function (it) {
      if (!tree) return "<li>" + inline(it.text) + (it.kids.length ? listHtml(it.kids, false, false) : "") + "</li>";
      if (!it.kids.length) return '<li><span class="leaf"></span>' + inline(it.text) + "</li>";
      return '<li><details class="node" open><summary>' + inline(it.text) + "</summary>" + listHtml(it.kids, false, true) + "</details></li>";
    }).join("") + "</" + tagName + ">";
  }
  function render(md) {
    var lines = md.replace(/\r/g, "").split("\n"), html = "", i = 0, inTrees = false;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      var h = /^(#{1,3})\s+(.*)$/.exec(l);
      if (h) {
        var lvl = h[1].length;
        if (lvl <= 2) inTrees = /four trees/i.test(h[2]);
        if (lvl > 1) html += "<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">";
        i++; continue;
      }
      if (/^\s*(?:[-*]|\d+\.)\s/.test(l)) {
        var block = [], ordered = /^\s*\d+\./.test(l);
        while (i < lines.length && lines[i].trim() && !/^#/.test(lines[i])) block.push(lines[i++]);
        var tree = inTrees && !ordered;
        html += tree ? '<div class="tree">' + listHtml(parseList(block), false, true) + "</div>" : listHtml(parseList(block), ordered, false);
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#|\s*(?:[-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
      html += "<p>" + inline(para.join(" ")) + "</p>";
    }
    return html;
  }
  var doc = document.getElementById("doc");
  fetch("../TOPIC-TREE.md?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) { doc.innerHTML = render(md); })
    .catch(function () { doc.innerHTML = '<p class="msg">The draft could not be loaded. Open the app from a web server (for example <code>python3 -m http.server</code>), not from a file.</p>'; });
  function setAll(open) { doc.querySelectorAll("details.node").forEach(function (d) { d.open = open; }); }
  document.getElementById("expand").addEventListener("click", function () { setAll(true); });
  document.getElementById("collapse").addEventListener("click", function () { setAll(false); });
})();
</script>
</body>
</html>
